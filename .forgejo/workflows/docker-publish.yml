# docker-publish — tag-triggered container image release to ghcr.io / Docker Hub.
#
# The programs live as real files in <action>/scripts/*.mjs and are executed with
# `node "$forgejo_dir/scripts/run.mjs" <subcommand>`; this file only orchestrates
# them. The reference implementations are the three official Docker Actions
# (build-push-action v7.4.0, metadata-action v6.2.0, login-action v4.6.0) kept in
# this repository under ref/docker-build-push/ — they are reference material only
# and are never copied to a target repository.
#
# Usage: copy this docker-build-push/ directory into a target repository, rename
# it to .forgejo, and the workflow runs there. Nothing in this file names a
# project: the variants live in `.forgejo/variants.txt` (or the DOCKER_VARIANTS
# variable), and the workflow discovers them at run time.
#
# Flow: tag push -> plan variants -> (per variant, in parallel) prepare the job
# container -> version check -> preflight -> docker login -> tags/labels -> one
# build -> push -> digest summary.
#
# Workbench: every job container is plain `docker:dind`. The runner starts job
# containers with `tail -f /dev/null`, so dockerd is NOT running; the `prepare`
# step starts it inside the container. That requires the runner to allow
# privileged job containers (runner setting `container.privileged: true`) —
# workflow-level `options: --privileged` is ignored by the runner:
#   runner config:
#     container:
#       privileged: true
# No volume mounts and no `valid_volumes` are needed any more.
#
# The image lacks node, so the first step installs what the scripts need (node,
# git, curl) with the container's own package manager; `prepare` then adds
# buildx (normally already in the image), any `DOCKER_JOB_PACKAGES`, and the
# QEMU binfmt handlers a multi-architecture build needs.
#
# Variants: `.forgejo/variants.txt` (or the repository variable DOCKER_VARIANTS)
# holds one line per variant, in the syntax the scripts use:
#   name|dockerfile|target|suffix|default|KEY=VALUE;…|platforms
# The `plan` job turns that table into the publish matrix, so adding a variant is
# one line in the table — not an edit here. Exactly one row says `true`; it owns
# `latest` and the unsuffixed tags. Because each variant is a separate job that
# only builds its own Dockerfile, a failed alpine job can never move `latest`.
#
# Repository secrets/variables (tokens may live in either place):
#   GHCR_TOKEN            GitHub PAT with write:packages -> enables ghcr.io
#   DOCKERHUB_TOKEN       Docker Hub access token      -> enables Docker Hub
#   DOCKERHUB_USERNAME    Docker Hub user + namespace  (required with the token)
#   GHCR_IMAGE            ghcr.io/<account>/<repo>, when the GHCR namespace
#                         differs from the Forgejo owner (it usually does)
# Optional variables:
#   DOCKER_VARIANTS       the variant table (wins over .forgejo/variants.txt)
#   DOCKER_META_IMAGES, DOCKER_META_TAGS, DOCKER_META_FLAVOR, DOCKER_META_LABELS
#   DOCKER_BUILD_ARGS, DOCKER_PLATFORMS, DOCKER_HOST, GHCR_IMAGE
#   DOCKER_JOB_PACKAGES   extra apk/apt/dnf packages the workbench image lacks
#   DOCKER_SKIP_BINFMT, DOCKER_BINFMT_IMAGE, DOCKER_BUILDKIT_IMAGE
#   ALL_PROXY / HTTP_PROXY / HTTPS_PROXY / NO_PROXY / APT_PROXY / NPM_PROXY / GOPROXY
#   APK_REPO / YUM_REPO (explicit repositories; APK_REPO feeds the APK_PROXY arg)
#   (see the env block below — that block is the complete, authoritative list)
#
# Platforms: a variant's seventh column decides its architectures (e.g.
# `linux/amd64,linux/arm64`); DOCKER_PLATFORMS is the fallback for rows without
# one. More than one platform makes build-push.mjs create a `docker-container`
# builder for that run.
#
# One job per variant (matrix from the plan job). Each variant compiles its own
# artifact against its own base image; nothing is shared between variants and no
# variant is produced by retagging another one. `fail-fast: false` keeps the
# variants independent: one failing must not cancel the other's publish.

name: docker-publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，例如 1.4.0；填写时必须与已有 tag 的版本一致'
        required: false
        type: string
      variants:
        description: '可选：只构建指定变体，逗号分隔（默认变体表里的全部）'
        required: false
        type: string
      dry_run:
        description: '只验证构建，不登录、不推送'
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-release-${{ github.ref_name }}
  cancel-in-progress: false

# `sh`, not `bash`: Alpine and other minimal images ship BusyBox sh but no bash
# (`/bin/sh` exists everywhere). The few remaining shell lines are POSIX.
defaults:
  run:
    shell: sh

jobs:
  # -------------------------------------------------------------------- plan
  # Turn the repository's variant table into the publish matrix. This is what
  # keeps the workflow project-agnostic: no variant name, Dockerfile or platform
  # is written down here.
  plan:
    name: plan variants
    runs-on: docker
    container:
      image: docker:dind
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    timeout-minutes: 15
    steps:
      # The workbench image has docker + buildx + git, but no node, and every
      # step below runs a node program. Install the runtime with the container's
      # own package manager; both orchestration jobs carry this same block.
      - name: Bootstrap job container
        run: |
          if ! { command -v node >/dev/null 2>&1 && command -v git >/dev/null 2>&1; }; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache nodejs npm git curl ca-certificates
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y --no-install-recommends nodejs npm git curl ca-certificates
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y nodejs npm git curl ca-certificates
            else
              yum install -y nodejs npm git curl ca-certificates
            fi
          fi
          node --version && git --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build uses the path context, so a shallow checkout is enough.
          # Set `submodules: true` in a repository that vendors sources as
          # submodules.
          fetch-depth: 1

      # github.action_path is empty for workflows (it is set only for a
      # `uses: ./path` local action), so the copied .forgejo directory is found by
      # the program and published as forgejo_dir. The two lines below only locate
      # the entry point itself: the real search (nested checkouts, parent mounts,
      # diagnostics) lives in locate-action.mjs.
      - name: Locate action directory
        id: locate
        run: |
          dir="${{ github.action_path }}"
          [ -f "$dir/scripts/build-push.mjs" ] || dir="$GITHUB_WORKSPACE/.forgejo"
          [ -f "$dir/scripts/build-push.mjs" ] || dir="$(dirname "$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name build-push.mjs -path '*/scripts/*' -print -quit)")")"
          node "$dir/scripts/run.mjs" locate-action

      - name: Verify action scripts
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" verify-action

      - name: Plan variant matrix
        id: plan
        env:
          # The table may live in the repository variable (wins) or in
          # .forgejo/variants.txt, which locate-action exports as
          # DOCKER_VARIANTS_FILE for the whole job.
          DOCKER_VARIANTS: ${{ vars.DOCKER_VARIANTS }}
          INPUT_VARIANTS: ${{ inputs.variants }}
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" plan-matrix

  # ----------------------------------------------------------------- publish
  publish:
    name: docker build and push (${{ matrix.variant }})
    needs: plan
    runs-on: docker
    strategy:
      fail-fast: false
      # One job per variant, discovered by the plan job (key → array form, which
      # is the shape a dynamic matrix supports).
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      # The workbench. `docker:dind` ships the docker CLI, the buildx plugin and
      # git; plain `docker:cli` works too. There is deliberately no `options:`
      # here: the runner ignores a workflow-level --privileged, and no volume
      # mount is needed because prepare starts its own daemon inside.
      image: docker:dind
    # Multi-architecture builds run foreign-arch stages under QEMU: slower than a
    # native build, hence the headroom.
    timeout-minutes: 180
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || vars.GHCR_TOKEN }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}
      # The variant table: the repository variable when set, otherwise
      # .forgejo/variants.txt (exported by locate-action). `INPUT_VARIANTS` is the
      # single variant this matrix job owns.
      DOCKER_VARIANTS: ${{ vars.DOCKER_VARIANTS }}
      INPUT_VARIANTS: ${{ matrix.variant }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      # Where the daemon lives (tcp://… or a non-default unix socket). Unset means
      # the unix socket prepare's dockerd listens on. A runner-managed daemon
      # (`container.docker_host: automount`, or DOCKER_HOST) is used as-is.
      DOCKER_HOST: ${{ vars.DOCKER_HOST }}
      DOCKER_META_IMAGES: ${{ vars.DOCKER_META_IMAGES }}
      DOCKER_META_TAGS: ${{ vars.DOCKER_META_TAGS }}
      DOCKER_META_FLAVOR: ${{ vars.DOCKER_META_FLAVOR }}
      DOCKER_META_LABELS: ${{ vars.DOCKER_META_LABELS }}
      DOCKER_BUILD_ARGS: ${{ vars.DOCKER_BUILD_ARGS }}
      # Fallback platforms for variant rows without their own seventh column.
      DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS }}
      # Extra packages for the workbench image (space/comma separated), installed
      # by prepare with the container's package manager.
      DOCKER_JOB_PACKAGES: ${{ vars.DOCKER_JOB_PACKAGES }}
      # QEMU binfmt: prepare registers the handlers the requested platforms need
      # unless DOCKER_SKIP_BINFMT is set; DOCKER_BINFMT_IMAGE overrides the image
      # it runs (tonistiigi/binfmt) for an internal mirror.
      DOCKER_SKIP_BINFMT: ${{ vars.DOCKER_SKIP_BINFMT }}
      DOCKER_BINFMT_IMAGE: ${{ vars.DOCKER_BINFMT_IMAGE }}
      # The builder container BuildKit runs in (default moby/buildkit:buildx-stable-1).
      DOCKER_BUILDKIT_IMAGE: ${{ vars.DOCKER_BUILDKIT_IMAGE }}
      # Endpoint variables (the same model as npm-publish).
      #   APT_PROXY / NPM_PROXY — the value may be a real forward proxy OR an
      #     internal MIRROR/registry: the resolve step probes it (does it serve its
      #     own index?) and uses it accordingly — apt as a repository, npm as the
      #     build's registry (injected as --build-arg NPM_REGISTRY), and only a
      #     genuine proxy as a proxy.
      #   The generic HTTP(S)_PROXY / ALL_PROXY are plain proxies for everything.
      ALL_PROXY: ${{ vars.ALL_PROXY }}
      HTTP_PROXY: ${{ vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
      NO_PROXY: ${{ vars.NO_PROXY }}
      APT_PROXY: ${{ vars.APT_PROXY }}
      # Explicit repositories (never probed): APK_REPO feeds the APK_PROXY build
      # arg, YUM_REPO is passed through as `--build-arg YUM_REPO`.
      APK_REPO: ${{ vars.APK_REPO }}
      YUM_REPO: ${{ vars.YUM_REPO }}
      NPM_PROXY: ${{ vars.NPM_PROXY }}
      # Go module proxy: passed into the build as --build-arg GOPROXY, so a
      # Dockerfile that declares ARG GOPROXY reaches an internal Athens.
      GOPROXY: ${{ vars.GOPROXY }}
    steps:
      # Same bootstrap as the plan job: node, git and curl before anything else,
      # because `actions/checkout` and every script step need them.
      - name: Bootstrap job container
        run: |
          if ! { command -v node >/dev/null 2>&1 && command -v git >/dev/null 2>&1; }; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache nodejs npm git curl ca-certificates
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y --no-install-recommends nodejs npm git curl ca-certificates
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y nodejs npm git curl ca-certificates
            else
              yum install -y nodejs npm git curl ca-certificates
            fi
          fi
          node --version && git --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate action directory
        id: locate
        run: |
          dir="${{ github.action_path }}"
          [ -f "$dir/scripts/build-push.mjs" ] || dir="$GITHUB_WORKSPACE/.forgejo"
          [ -f "$dir/scripts/build-push.mjs" ] || dir="$(dirname "$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name build-push.mjs -path '*/scripts/*' -print -quit)")")"
          node "$dir/scripts/run.mjs" locate-action

      - name: Verify action scripts
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" verify-action

      - name: Prepare build environment
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" prepare

      - name: Resolve version and variants
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" resolve

      - name: Preflight checks
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" preflight

      - name: Log in to registries
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" login

      - name: Compute tags and labels
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" meta

      - name: Build and push
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" build-push

      - name: Summary
        run: |
          dir="${{ steps.locate.outputs.forgejo_dir }}"
          node "$dir/scripts/run.mjs" summary
